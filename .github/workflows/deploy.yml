# CI/CD for the VW Autoreport Lambdas.
#
# The image build needs no external credentials: pycore is vendored as a wheel in
# ./vendor and all pins live in requirements-docker.txt. The Lambdas, the Step Function
# and the EventBridge schedule are created by hand in AWS; this workflow only builds the
# image, pushes it and points the existing image Lambdas at it.
#
# Required repository configuration:
#   secrets.AWS_DEPLOY_ROLE_ARN_DEV   IAM role assumable via GitHub OIDC (dev account)
#   secrets.AWS_DEPLOY_ROLE_ARN_PROD  IAM role assumable via GitHub OIDC (prod account)
#   vars.AWS_REGION                   e.g. eu-west-1
#   vars.ECR_REPOSITORY               e.g. vw_autoreport_render
#   vars.LAMBDA_FUNCTIONS             image Lambdas to update, comma-separated,
#                                     e.g. vw-autoreport-render
#
# PRs / main -> test only
# v*         -> test, build, push, update the Lambdas in prod (environment protection rule recommended)
# manual     -> test, build, push, update the Lambdas (dev for branches, prod for v* tags)

name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unixODBC (pycore imports pyodbc)
        run: sudo apt-get update && sudo apt-get install -y unixodbc unixodbc-dev
      - name: Install dependencies
        run: |
          pip install -r requirements-docker.txt
          pip install pytest pytest-mock "moto[s3,ses]>=5"
      - name: Run tests
        run: pytest -q

  build-and-deploy:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}
    env:
      STAGE: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.STAGE == 'prod' && secrets.AWS_DEPLOY_ROLE_ARN_PROD || secrets.AWS_DEPLOY_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ vars.ECR_REPOSITORY }}" >/dev/null 2>&1 \
            || aws ecr create-repository --repository-name "${{ vars.ECR_REPOSITORY }}" --image-scanning-configuration scanOnPush=true

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            -f deployment/Dockerfile \
            -t "$IMAGE" \
            --push .
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Update the Lambda functions
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          LAMBDA_FUNCTIONS: ${{ vars.LAMBDA_FUNCTIONS }}
        run: |
          for fn in ${LAMBDA_FUNCTIONS//,/ }; do
            aws lambda update-function-code --function-name "$fn" --image-uri "$IMAGE" >/dev/null
            aws lambda wait function-updated --function-name "$fn"
            echo "$fn -> $IMAGE"
          done
