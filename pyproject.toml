[tool.poetry]
name = "fn-analytics-vw-autoreport"
version = "0.1.0"
description = "Automated PowerPoint reporting for VW (config center + database data)"
authors = ["Factory Navigator"]

[tool.poetry.scripts]
pptcreator = "pptcreator.api.cli.commands:app"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
typer = "^0.7.0"
pandas = "^2"
numpy = ">=1.26,<3"
pycore = {git = "https://factorynavigator@dev.azure.com/factorynavigator/BE_FactoryNavigator/_git/FN.Analytics.PyCore", rev="master", extras = ["azure", "webapi"]}
pydantic = "^2"
pydantic-settings = "^2"
fastapi = ">=0.115"
pytest-mock = "^3.14.0"
python-pptx = "^1.0.2"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^7.2.1"
pytest-cov = "^4.1.0"
pytest-azurepipelines = "^1.0.5"
httpx = "0.27.2"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.4.2"
mkdocs-material = "^9.0.6"
mkdocstrings = {version = "0.20.0", extras = ["python"]}
mkdocs-autorefs = "1.4.0"
griffe = "0.45.0"


[tool.poetry.group.dev.dependencies]
black = "^26.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
