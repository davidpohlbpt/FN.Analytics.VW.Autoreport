AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: VW Autoreport - KPI PowerPoint decks planned, rendered and sent by three Lambdas in a Step Functions state machine

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  ImageUri:
    Type: String
    Description: ECR image URI (set by the deploy pipeline); shared by all three functions
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with connectivity to the VW network (DQN host + SQL Server)
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group allowing egress to the DQN host (443) and SQL Server (1433)
  SesSender:
    Type: String
    Description: Verified SES sender address
  DqnHost:
    Type: String
    Description: DQN host without scheme, e.g. dqn.volkswagen.de
  SqlConnStringSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the ODBC connection string (plain string secret)
  DqnCredentialsSecretArn:
    Type: String
    Description: "Secrets Manager ARN holding a JSON secret with keys username and password"
  DefaultTemplateId:
    Type: String
    Default: "1"
  WeeklyScheduleExpression:
    Type: String
    Default: cron(0 6 ? * MON *)
    Description: EventBridge schedule (UTC) for the weekly run
  WeeklyScheduleEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  AdhocPollRate:
    Type: String
    Default: rate(10 minutes)
  AdhocPollEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
  MailEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Conditions:
  WeeklyEnabled: !Equals [!Ref WeeklyScheduleEnabled, "true"]
  AdhocEnabled: !Equals [!Ref AdhocPollEnabled, "true"]

Globals:
  Function:
    PackageType: Image
    Timeout: 900
    VpcConfig:
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds: !Ref SecurityGroupIds
    Environment:
      Variables:
        APP_NAME: VwAutoreport
        RESOURCE_TYPE: LOCAL
        LOCAL_BLOB_DIR: /tmp/autoreport_data
        APP_DB_NAME: ReportDB
        LOCAL_SQLSERVER_DB: ReportDB
        # Secrets are resolved by CloudFormation at deploy time into env vars that
        # pycore's EnvVault / LocalSettings read. Rotation requires a redeploy.
        LOCAL_SQLSERVER_CONN_STR: !Sub "{{resolve:secretsmanager:${SqlConnStringSecretArn}}}"
        USERNAME: !Sub "{{resolve:secretsmanager:${DqnCredentialsSecretArn}:SecretString:username}}"
        PASSWORD: !Sub "{{resolve:secretsmanager:${DqnCredentialsSecretArn}:SecretString:password}}"
        BASE_REQUEST_URL: !Ref DqnHost
        ENDPOINTBASEPATH: !Sub https://${DqnHost}
        AWS_REGION_NAME: !Ref AWS::Region
        AUTOREPORT_SCHEMA: control
        DEFAULT_TEMPLATE_ID: !Ref DefaultTemplateId
        S3_ENABLED: "true"
        S3_BUCKET: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
        S3_TEMPLATE_KEY: templates/VW_Template_Overview.pptx
        S3_OUTPUT_PREFIX: !Sub reports/${Stage}
        MAIL_ENABLED: !Ref MailEnabled
        SES_SENDER: !Ref SesSender
        SES_RECIPIENTS_MODE: bcc
        REPORT_LANGUAGE: DE

Resources:
  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 180

  # ------------------------------ Lambda 1: plan ------------------------------ #
  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vw-autoreport-${Stage}-plan
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["pptcreator.lambda_handler.plan_handler"]
      MemorySize: 1024
      Timeout: 120
      Policies:
        - VPCAccessPolicy: {}

  # ----------------------------- Lambda 2: render ----------------------------- #
  RenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vw-autoreport-${Stage}-render
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["pptcreator.lambda_handler.render_handler"]
      MemorySize: 2048
      EphemeralStorage:
        Size: 1024
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
        - S3WritePolicy:
            BucketName: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
        - VPCAccessPolicy: {}

  # ------------------------------ Lambda 3: send ------------------------------ #
  SendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vw-autoreport-${Stage}-send
      ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["pptcreator.lambda_handler.send_handler"]
      MemorySize: 1024
      Timeout: 120
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action: [ses:SendRawEmail, ses:SendEmail]
              Resource: "*"
        - VPCAccessPolicy: {}

  # ------------------------------ State machine ------------------------------- #
  ReportStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub vw-autoreport-${Stage}
      DefinitionUri: state_machine.asl.json
      DefinitionSubstitutions:
        PlanFunctionArn: !GetAtt PlanFunction.Arn
        RenderFunctionArn: !GetAtt RenderFunction.Arn
        SendFunctionArn: !GetAtt SendFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PlanFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RenderFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SendFunction
      Events:
        Weekly:
          Type: Schedule
          Properties:
            Name: !Sub vw-autoreport-${Stage}-weekly
            Schedule: !Ref WeeklyScheduleExpression
            Enabled: !If [WeeklyEnabled, true, false]
            Input: !Sub '{"trigger": "scheduled", "template_id": ${DefaultTemplateId}}'
        AdhocPoll:
          Type: Schedule
          Properties:
            Name: !Sub vw-autoreport-${Stage}-adhoc
            Schedule: !Ref AdhocPollRate
            Enabled: !If [AdhocEnabled, true, false]
            Input: !Sub '{"trigger": "adhoc", "template_id": ${DefaultTemplateId}}'

  PlanLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vw-autoreport-${Stage}-plan
      RetentionInDays: 90
  RenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vw-autoreport-${Stage}-render
      RetentionInDays: 90
  SendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vw-autoreport-${Stage}-send
      RetentionInDays: 90

Outputs:
  StateMachineArn:
    Value: !Ref ReportStateMachine
  RenderFunctionName:
    Value: !Ref RenderFunction
  BucketName:
    Value: !Ref ReportBucket
  RenderInvokeExample:
    Value: !Sub >-
      aws lambda invoke --function-name ${RenderFunction}
      --cli-binary-format raw-in-base64-out
      --payload file://deployment/events/render_request.json out.json
