AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: VW Autoreport - KPI PowerPoint decks planned, rendered, sent and recorded by four Lambdas in a Step Functions state machine

Parameters:
  Stage:
    Type: String
    AllowedValues: [dev, prod]
    Default: dev
  ImageUri:
    Type: String
    Description: ECR image URI (set by the deploy pipeline); shared by the plan, render and record functions
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with connectivity to the VW network (DQN host + SQL Server)
  SecurityGroupIds:
    Type: List<AWS::EC2::SecurityGroup::Id>
    Description: Security group allowing egress to the DQN host (443) and SQL Server (1433)
  SesSender:
    Type: String
    Description: Verified SES sender address
  DqnHost:
    Type: String
    Description: DQN host without scheme, e.g. dqn.volkswagen.de
  SqlConnStringSecretArn:
    Type: String
    Description: Secrets Manager ARN holding the ODBC connection string (plain string secret)
  DqnCredentialsSecretArn:
    Type: String
    Description: "Secrets Manager ARN holding a JSON secret with keys username and password"
  DefaultTemplateId:
    Type: String
    Default: "1"
    Description: Template for events that name none (e.g. manual render events)
  PlanTemplateIds:
    Type: String
    Default: ""
    Description: >-
      Templates the plan Lambda processes per run: comma-separated ids (e.g. "1,3") or
      "all". Empty -> DefaultTemplateId. A template_id / template_ids in the execution
      input still takes precedence.
  AdhocPollRate:
    Type: String
    Default: rate(5 minutes)
    Description: How often send_now = 1 rows are picked up
  AdhocPollEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: The poller is the only trigger; there is no weekly run any more
  MailEnabled:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"

Conditions:
  AdhocEnabled: !Equals [!Ref AdhocPollEnabled, "true"]

Globals:
  Function:
    Timeout: 900

# Plan, render and record run from the container image (pycore, ODBC driver, VPC access
# to SQL Server / DQN). Globals cannot be switched off per function, so image settings
# and secrets are repeated on these three functions only; the send ZIP gets none of them.

Resources:
  ReportBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldReports
            Status: Enabled
            Prefix: reports/
            ExpirationInDays: 180

  # ------------------------------ Lambda 1: plan ------------------------------ #
  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vw-autoreport-${Stage}-plan
      PackageType: Image
      ImageUri: !Ref ImageUri
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          APP_NAME: VwAutoreport
          RESOURCE_TYPE: LOCAL
          LOCAL_BLOB_DIR: /tmp/autoreport_data
          APP_DB_NAME: ReportDB
          LOCAL_SQLSERVER_DB: ReportDB
          # Secrets are resolved by CloudFormation at deploy time into env vars that
          # pycore's EnvVault / LocalSettings read. Rotation requires a redeploy.
          LOCAL_SQLSERVER_CONN_STR: !Sub "{{resolve:secretsmanager:${SqlConnStringSecretArn}}}"
          USERNAME: !Sub "{{resolve:secretsmanager:${DqnCredentialsSecretArn}:SecretString:username}}"
          PASSWORD: !Sub "{{resolve:secretsmanager:${DqnCredentialsSecretArn}:SecretString:password}}"
          BASE_REQUEST_URL: !Ref DqnHost
          ENDPOINTBASEPATH: !Sub https://${DqnHost}
          AWS_REGION_NAME: !Ref AWS::Region
          AUTOREPORT_SCHEMA: control
          DEFAULT_TEMPLATE_ID: !Ref DefaultTemplateId
          PLAN_TEMPLATE_IDS: !Ref PlanTemplateIds
          S3_ENABLED: "true"
          S3_BUCKET: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
          S3_TEMPLATE_KEY: templates/VW_Template_Overview.pptx
          S3_OUTPUT_PREFIX: !Sub reports/${Stage}
          REPORT_LANGUAGE: DE
      ImageConfig:
        Command: ["pptcreator.lambdas.plan.handler"]
      MemorySize: 1024
      Timeout: 120
      Policies:
        - VPCAccessPolicy: {}

  # ----------------------------- Lambda 2: render ----------------------------- #
  RenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vw-autoreport-${Stage}-render
      PackageType: Image
      ImageUri: !Ref ImageUri
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          APP_NAME: VwAutoreport
          RESOURCE_TYPE: LOCAL
          LOCAL_BLOB_DIR: /tmp/autoreport_data
          APP_DB_NAME: ReportDB
          LOCAL_SQLSERVER_DB: ReportDB
          # Secrets are resolved by CloudFormation at deploy time into env vars that
          # pycore's EnvVault / LocalSettings read. Rotation requires a redeploy.
          LOCAL_SQLSERVER_CONN_STR: !Sub "{{resolve:secretsmanager:${SqlConnStringSecretArn}}}"
          USERNAME: !Sub "{{resolve:secretsmanager:${DqnCredentialsSecretArn}:SecretString:username}}"
          PASSWORD: !Sub "{{resolve:secretsmanager:${DqnCredentialsSecretArn}:SecretString:password}}"
          BASE_REQUEST_URL: !Ref DqnHost
          ENDPOINTBASEPATH: !Sub https://${DqnHost}
          AWS_REGION_NAME: !Ref AWS::Region
          AUTOREPORT_SCHEMA: control
          DEFAULT_TEMPLATE_ID: !Ref DefaultTemplateId
          PLAN_TEMPLATE_IDS: !Ref PlanTemplateIds
          S3_ENABLED: "true"
          S3_BUCKET: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
          S3_TEMPLATE_KEY: templates/VW_Template_Overview.pptx
          S3_OUTPUT_PREFIX: !Sub reports/${Stage}
          REPORT_LANGUAGE: DE
      ImageConfig:
        Command: ["pptcreator.lambdas.render.handler"]
      MemorySize: 2048
      EphemeralStorage:
        Size: 1024
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
        - S3WritePolicy:
            BucketName: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
        - VPCAccessPolicy: {}

  # ----------------------- Lambda 3: send (ZIP, no VPC) ----------------------- #
  # Only the standard library and boto3 (part of the runtime); reaches S3 and SES over
  # the public AWS endpoints, so it needs neither the VPC nor any database secret.
  SendFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vw-autoreport-${Stage}-send
      PackageType: Zip
      Runtime: python3.12
      Architectures: [x86_64]
      CodeUri: ../functions/send
      Handler: sender.app.handler
      MemorySize: 512
      Timeout: 120
      Environment:
        Variables:
          MAIL_ENABLED: !Ref MailEnabled
          SES_SENDER: !Ref SesSender
          SES_RECIPIENTS_MODE: bcc
          SES_MAX_ATTACHMENT_MB: "35"
      Policies:
        - S3ReadPolicy:
            BucketName: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
        - Statement:
            - Effect: Allow
              Action: [ses:SendRawEmail]
              Resource: "*"

  # ------------------------------ Lambda 4: record ----------------------------- #
  RecordFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub vw-autoreport-${Stage}-record
      PackageType: Image
      ImageUri: !Ref ImageUri
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds: !Ref SecurityGroupIds
      Environment:
        Variables:
          APP_NAME: VwAutoreport
          RESOURCE_TYPE: LOCAL
          LOCAL_BLOB_DIR: /tmp/autoreport_data
          APP_DB_NAME: ReportDB
          LOCAL_SQLSERVER_DB: ReportDB
          # Secrets are resolved by CloudFormation at deploy time into env vars that
          # pycore's EnvVault / LocalSettings read. Rotation requires a redeploy.
          LOCAL_SQLSERVER_CONN_STR: !Sub "{{resolve:secretsmanager:${SqlConnStringSecretArn}}}"
          USERNAME: !Sub "{{resolve:secretsmanager:${DqnCredentialsSecretArn}:SecretString:username}}"
          PASSWORD: !Sub "{{resolve:secretsmanager:${DqnCredentialsSecretArn}:SecretString:password}}"
          BASE_REQUEST_URL: !Ref DqnHost
          ENDPOINTBASEPATH: !Sub https://${DqnHost}
          AWS_REGION_NAME: !Ref AWS::Region
          AUTOREPORT_SCHEMA: control
          DEFAULT_TEMPLATE_ID: !Ref DefaultTemplateId
          PLAN_TEMPLATE_IDS: !Ref PlanTemplateIds
          S3_ENABLED: "true"
          S3_BUCKET: !Sub vw-autoreport-${Stage}-${AWS::AccountId}
          S3_TEMPLATE_KEY: templates/VW_Template_Overview.pptx
          S3_OUTPUT_PREFIX: !Sub reports/${Stage}
          REPORT_LANGUAGE: DE
      ImageConfig:
        Command: ["pptcreator.lambdas.record.handler"]
      MemorySize: 512
      Timeout: 120
      Policies:
        - VPCAccessPolicy: {}

  # ------------------------------ State machine ------------------------------- #
  ReportStateMachine:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub vw-autoreport-${Stage}
      DefinitionUri: state_machine.asl.json
      DefinitionSubstitutions:
        PlanFunctionArn: !GetAtt PlanFunction.Arn
        RenderFunctionArn: !GetAtt RenderFunction.Arn
        SendFunctionArn: !GetAtt SendFunction.Arn
        RecordFunctionArn: !GetAtt RecordFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref PlanFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RenderFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref SendFunction
        - LambdaInvokePolicy:
            FunctionName: !Ref RecordFunction
      Events:
        AdhocPoll:
          Type: Schedule
          Properties:
            Name: !Sub vw-autoreport-${Stage}-poll
            Schedule: !Ref AdhocPollRate
            Enabled: !If [AdhocEnabled, true, false]
            Input: '{"trigger": "adhoc"}'

  PlanLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vw-autoreport-${Stage}-plan
      RetentionInDays: 90
  RenderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vw-autoreport-${Stage}-render
      RetentionInDays: 90
  SendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vw-autoreport-${Stage}-send
      RetentionInDays: 90
  RecordLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/vw-autoreport-${Stage}-record
      RetentionInDays: 90

Outputs:
  StateMachineArn:
    Value: !Ref ReportStateMachine
  RenderFunctionName:
    Value: !Ref RenderFunction
  BucketName:
    Value: !Ref ReportBucket
  RenderInvokeExample:
    Value: !Sub >-
      aws lambda invoke --function-name ${RenderFunction}
      --cli-binary-format raw-in-base64-out
      --payload file://deployment/events/render_request.json out.json
